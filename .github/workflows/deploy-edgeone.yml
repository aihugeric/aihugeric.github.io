name: Deploy to EdgeOne Pages

# 部署到腾讯云 EdgeOne Pages
# ⚠️ 加速区域需在 EdgeOne 控制台配置（不支持 CLI 指定）：
#    项目设置 → 加速区域 → 选择「全球可用区（不含中国大陆）」
#    这样绑定自定义域名时无需 ICP 备案

on:
  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edgeone-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build VitePress
        run: npx vitepress build docs

      - name: Install EdgeOne CLI
        run: npm install -g edgeone

      - name: Deploy to EdgeOne Pages (production)
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: |
          edgeone makers deploy ./docs/.vitepress/dist \
            -n aihugeric-blog \
            -t "$EDGEONE_API_TOKEN" \
            -e production

      - name: Deployment info
        run: |
          echo "✅ 部署完成！"
          echo "📍 默认访问地址: https://aihugeric-blog-hyqltofp.edgeone.cool"
          echo "🔧 自定义域名绑定: EdgeOne 控制台 → 域名管理 → 添加自定义域名"
          echo "⚠️  加速区域请选择「不含中国大陆」以避免备案要求"
