name: Deploy to EdgeOne Pages

# 部署到腾讯云 EdgeOne Pages
# ⚠️ 加速区域在项目创建时选定，创建后不可修改！
#    首次部署前，请先在 EdgeOne 控制台手动创建项目并选择加速区域：
#    新建项目 → 加速区域 → 选择「全球可用区（不含中国大陆）」→ 免备案绑定自定义域名
#    项目名必须为 aihugeric-blog（与下方 -n 参数一致）

on:
  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edgeone-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build VitePress
        run: npx vitepress build docs

      - name: Install EdgeOne CLI
        run: npm install -g edgeone

      - name: Deploy to EdgeOne Pages (production)
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: |
          edgeone makers deploy ./docs/.vitepress/dist \
            -n aihugeric-blog \
            -t "$EDGEONE_API_TOKEN" \
            -e production

      - name: Deployment info
        run: |
          echo "✅ 部署完成！"
          echo "📍 默认访问地址: https://aihugeric-blog-hyqltofp.edgeone.cool"
          echo "🔧 自定义域名绑定: EdgeOne 控制台 → 域名管理 → 添加自定义域名"
          echo "⚠️  加速区域在项目创建时选定，不可修改，请确保选了「不含中国大陆」"
