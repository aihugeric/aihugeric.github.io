name: Deploy to EdgeOne Pages (CLI fallback)

# ⚠️ 主要部署方式已改为 EdgeOne Git 集成（控制台自动构建）
#    此工作流仅作为备用，手动触发时通过 CLI 上传构建产物
#
# EdgeOne Git 集成配置（控制台）：
#   根目录: ./
#   安装命令: npm install
#   构建命令: npx vitepress build docs
#   输出目录: docs/.vitepress/dist
#
# 加速区域在项目创建时选定，创建后不可修改
# 如需免备案绑定自定义域名，请确保选了「全球可用区（不含中国大陆）」

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build VitePress
        run: npx vitepress build docs

      - name: Install EdgeOne CLI
        run: npm install -g edgeone

      - name: Deploy to EdgeOne Pages (production)
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: |
          edgeone makers deploy ./docs/.vitepress/dist \
            -n aihugeric-blog \
            -t "$EDGEONE_API_TOKEN" \
            -e production

      - name: Deployment info
        run: |
          echo "✅ 部署完成！"
          echo "📍 默认访问地址: https://aihugeric-blog-hyqltofp.edgeone.cool"
          echo "🔧 自定义域名绑定: EdgeOne 控制台 → 域名管理 → 添加自定义域名"
